<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08101d"><title>WISP Setup</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="topbar"><div><p class="eyebrow">UPLINK MODE</p><h1>WISP Setup</h1><p class="muted">Prepare a wireless uplink and downstream network.</p></div><nav><a href="index.html">Dashboard</a><a href="scan.html">Scan</a><a href="select.html">Select</a><a class="active" href="wisp.html">WISP</a></nav></header><section class="panel"><div class="formgrid"><label>Selected network<input id="ssid" readonly></label><label>Upstream interface<input id="up" value="wlan0"></label><label>Downstream interface<input id="down" value="br-lan"></label><label>Credential reference<input id="cred" type="password" placeholder="Administrator supplied"></label></div><button id="validate">Validate setup</button><p id="status" class="muted">Not validated</p></section><section class="panel"><h2>Safety</h2><p class="muted">Protected Wi-Fi requires credentials supplied by the administrator. This UI does not recover, crack, bypass, or log Wi-Fi passwords.</p></section></main><script>const q=new URLSearchParams(location.search);document.getElementById("ssid").value=q.get("ssid")||"None";document.getElementById("validate").onclick=()=>document.getElementById("status").textContent="Setup is ready for capability-aware backend validation.";</script></body></html>
